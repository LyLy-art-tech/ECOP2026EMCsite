<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Bruit fractal autonome : texture « papier » pour le fond du site -->
  <filter id="bruit" x="0" y="0" width="100%" height="100%" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" seed="7" stitchTiles="stitch" result="bruit"/>
    <feColorMatrix in="bruit" type="saturate" values="0"/>
  </filter>
  <rect width="200" height="200" filter="url(#bruit)"/>
</svg>
